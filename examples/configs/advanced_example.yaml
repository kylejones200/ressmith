# PetroSmith Example - Advanced Analysis
# Comprehensive geostatistical analysis with preprocessing

project:
  name: "Advanced Geostatistical Analysis"
  description: "Example with outlier removal and data transformation"
  output_dir: "./results/advanced_example"
  author: "PetroSmith Team"
  tags:
    - example
    - advanced
    - kriging

data:
  input_file: "examples/configs/sample_data.csv"
  x_column: "x"
  y_column: "y"
  z_column: "value"
  delimiter: ","

preprocessing:
  remove_outliers: true
  outlier_method: "iqr"
  outlier_threshold: 3.0
  transform: "log"
  handle_negatives: "shift"
  standardize: false

variogram:
  n_lags: 20
  max_lag: null  # Auto-calculated
  lag_tolerance: 0.5
  models:
    - spherical
    - exponential
    - gaussian
  auto_fit: true
  fit_method: "wls"
  anisotropy: false

kriging:
  method: "ordinary"
  neighborhood:
    max_neighbors: 30
    min_neighbors: 5
    search_radius: null
    search_strategy: "circular"
  grid:
    x_min: 0.0
    x_max: 100.0
    y_min: 0.0
    y_max: 100.0
    resolution: 1.0
    method: "regular"

validation:
  cross_validation: true
  n_folds: 10
  metrics:
    - rmse
    - mae
    - r2
    - mse
  holdout_fraction: 0.0
  random_seed: 42

visualization:
  style: "publication"
  plots:
    - variogram
    - kriging_map
    - variance_map
    - cross_validation
    - histogram
  colormap: "viridis"
  dpi: 300
  figure_size:
    - 12
    - 10
  show_data_points: true
  contour_levels: 25

output:
  save_predictions: true
  save_variance: true
  save_plots: true
  save_model: true
  save_config: true
  formats:
    - csv
    - npy
    - png
    - json
  compression: false
