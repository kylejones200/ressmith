[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrosmith"
version = "0.3.0"
description = "Petroleum Engineering Library"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["petroleum", "engineering", "drilling", "reservoir", "well-testing", "geomechanics"]
authors = [
    {name = "PetroSmith Team", email = "info@petrosmith.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.11.4",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pydantic==2.5.0",
    "python-dateutil==2.8.2",
    "click==8.1.7",
    "pyyaml==6.0.1",
    "python-dotenv==1.0.0",
    "jsonschema==4.20.0",
]

[project.optional-dependencies]
# Decline curve analysis (Arps, hyperbolic, ML) via decline-curve library
# https://pypi.org/project/decline-curve/
dca = [
    "decline-curve>=0.2.0",
    "pandas>=2.0",
]
# Dev deps (also in [dependency-groups] for uv)
dev = [
    "black==23.12.1",
    "isort==5.13.2",
    "flake8==7.0.0",
    "pylint==3.0.3",
    "flake8-docstrings==1.7.0",
    "flake8-bugbear==24.1.17",
    "mypy==1.8.0",
    "types-setuptools==69.0.0.20240125",
    "bandit==1.7.6",
    "safety>=3.2.11",
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "build==1.0.3",
    "twine>=5.0.0",
    "setuptools>=65.0.0",
    "wheel>=0.42.0",
    "pre-commit==3.6.0",
]

[dependency-groups]
dev = [
    "black==23.12.1",
    "isort==5.13.2",
    "flake8==7.0.0",
    "pylint==3.0.3",
    "flake8-docstrings==1.7.0",
    "flake8-bugbear==24.1.17",
    "mypy==1.8.0",
    "types-setuptools==69.0.0.20240125",
    "bandit==1.7.6",
    "safety>=3.2.11",
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "build==1.0.3",
    "twine>=5.0.0",
    "setuptools>=65.0.0",
    "wheel>=0.42.0",
    "pre-commit==3.6.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/petrosmith"
Documentation = "https://github.com/yourusername/petrosmith#readme"
Repository = "https://github.com/yourusername/petrosmith"
Issues = "https://github.com/yourusername/petrosmith/issues"

[project.scripts]
petrosmith = "petrosmith.cli.main:cli"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring  
    "C0116",  # missing-function-docstring
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -W ignore::pydantic.warnings.PydanticDeprecatedSince20"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.coverage.run]
source = ["petrosmith"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
