# PetroSmith Example - Basic Analysis
# Simple geostatistical analysis

project:
  name: "Basic Geostatistical Analysis"
  description: "Simple example with minimal configuration"
  output_dir: "./results/basic_example"

data:
  input_file: "examples/configs/sample_data.csv"
  x_column: "x"
  y_column: "y"
  z_column: "value"
  delimiter: ","

preprocessing:
  remove_outliers: false
  transform: null

variogram:
  n_lags: 15
  models:
    - spherical
    - exponential
    - gaussian
  auto_fit: true
  fit_method: "wls"

kriging:
  method: "ordinary"
  neighborhood:
    max_neighbors: 25
    min_neighbors: 3
  grid:
    x_min: 0.0
    x_max: 100.0
    y_min: 0.0
    y_max: 100.0
    resolution: 5.0

validation:
  cross_validation: true
  n_folds: 5
  metrics:
    - rmse
    - mae
    - r2

visualization:
  style: "minimalist"
  plots:
    - variogram
    - kriging_map
    - cross_validation
  colormap: "viridis"
  dpi: 150

output:
  save_predictions: true
  save_variance: true
  save_plots: true
  save_config: true
  formats:
    - csv
    - png
