# PetroSmith Example - Drilling Analysis
# Mud weight and pressure analysis

project:
  name: "Drilling Pressure Analysis"
  description: "Spatial analysis of drilling pressures and mud weights"
  output_dir: "./results/drilling_analysis"
  tags:
    - drilling
    - mud_weight
    - pressure

data:
  input_file: "examples/configs/drilling_data.csv"
  x_column: "easting"
  y_column: "northing"
  z_column: "formation_pressure"
  crs: "EPSG:32610"
  delimiter: ","

preprocessing:
  remove_outliers: true
  outlier_method: "modified_zscore"
  outlier_threshold: 3.5
  transform: null

variogram:
  n_lags: 15
  models:
    - spherical
    - exponential
  auto_fit: true
  fit_method: "wls"

kriging:
  method: "ordinary"
  neighborhood:
    max_neighbors: 25
    min_neighbors: 3
  grid:
    x_min: 500000
    x_max: 520000
    y_min: 4000000
    y_max: 4020000
    resolution: 100

validation:
  cross_validation: true
  n_folds: 5
  metrics:
    - rmse
    - mae

visualization:
  style: "publication"
  plots:
    - variogram
    - kriging_map
    - variance_map
  colormap: "jet"
  dpi: 300

output:
  save_predictions: true
  save_variance: true
  save_plots: true
  formats:
    - csv
    - png

# Drilling-specific configuration
drilling:
  calculate_mud_weight: true
  pressure_gradient: 0.465  # psi/ft
  wellbore_stability: true
  drilling_parameters:
    max_safe_mud_weight: 16.0
    min_safe_mud_weight: 9.0
    kick_tolerance: 0.5
